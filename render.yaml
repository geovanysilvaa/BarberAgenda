services:
  - type: web
    name: barber-agenda-api
    runtime: node
    plan: free
    # ⚠️ DICA: coloque a MESMA região do seu projeto Supabase
    # (ex: both us-east-1 / both sa-east-1) — corta latência cross-region.
    # region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    # Healthcheck evita que a Render marque a instância como down sem motivo
    healthCheckPath: /api/v1/barbershops
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first --max-old-space-size=512
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
